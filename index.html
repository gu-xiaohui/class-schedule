<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>兴趣班课程表</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #2c2c2c; --muted: #8d8b84;
    --line: #e4e2dc; --green: #417f55; --red: #8a4c46; --accent: #68614b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    max-width: 760px; margin: 0 auto; padding: 16px 14px 60px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 22px; letter-spacing: 1px; }
  #todayStr { color: var(--muted); font-size: 13px; }
  .sec { margin-top: 18px; }
  .sec > h2 { font-size: 15px; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

  /* 今日打卡卡 */
  .today-card { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .today-card .cls { flex: 1 1 140px; }
  .cls-emoji { font-size: 26px; margin-right: 6px; }
  .cls-name { font-size: 17px; font-weight: 600; }
  .cls-meta { font-size: 12px; color: var(--muted); }
  .remaining-pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; color: #fff; margin-left: 6px; vertical-align: 2px; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 600;
    cursor: pointer; min-height: 46px; color: #fff;
  }
  .btn.attend { background: var(--green); }
  .btn.miss { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
  .btn.small { padding: 8px 12px; font-size: 13px; min-height: 38px; font-weight: 500; }
  .done-note { font-size: 13px; color: var(--green); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  /* 周视图 */
  .day-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--line); }
  .day-row.today { border-color: var(--accent); background: #fbfaf7; }
  .day-label { width: 44px; flex: none; font-weight: 700; font-size: 14px; }
  .day-row.today .day-label { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; padding: 6px 12px; border-radius: 999px; color: #fff; }
  .chip .t { font-size: 11px; opacity: .9; font-weight: 400; }

  /* 统计与管理 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td .ops { display: flex; gap: 6px; }
  .link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 6px 8px; }
  .link-btn.danger { color: var(--red); }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--accent); }
  form.add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=time], input[type=number], input[type=date], select {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; background: #fff; min-height: 44px;
  }
  .weekday-picks { display: flex; gap: 4px; flex-wrap: wrap; }
  .weekday-picks label { border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 13px; cursor: pointer; user-select: none; }
  .weekday-picks input { display: none; }
  .weekday-picks label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }

  .history-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .history-item .sub { color: var(--muted); font-size: 12px; }
  .note-text { color: var(--ink); font-size: 14px; margin-top: 2px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .filter-chips button { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .filter-chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .entry-note { background: #f8f7f4; border-radius: 10px; padding: 8px 10px; margin-top: 4px; font-size: 14px; }
  #addEntryForm { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: flex-end; }
  #addEntryForm textarea { flex: 1 1 100%; height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; background: #fff; }
  .tag-attend { color: var(--green); font-weight: 600; }
  .tag-miss { color: var(--muted); }

  textarea { width: 100%; height: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; font-family: monospace; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>兴趣班课程表</h1>
  <div id="todayStr"></div>
</header>

<div class="sec">
  <h2>📍 今天的课</h2>
  <div id="todayArea"></div>
</div>

<div class="sec">
  <h2>🗓 每周安排</h2>
  <div id="weekArea"></div>
</div>

<div class="sec">
  <details>
    <summary>📊 课程与课时统计 · 添加 / 编辑</summary>
    <div style="overflow-x:auto; margin-top: 10px;">
      <table>
        <thead><tr><th>课程</th><th>时间</th><th>周几</th><th>已上</th><th>缺勤</th><th>剩余</th><th>操作</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
    <form class="add-form" id="addForm">
      <div class="field"><label>图标</label><input type="text" id="fEmoji" value="⭐" style="width:52px;text-align:center"></div>
      <div class="field"><label>课程名</label><input type="text" id="fName" placeholder="如：围棋" required></div>
      <div class="field"><label>时间(可空)</label><input type="text" id="fTime" placeholder="17:30-18:30" style="width:130px"></div>
      <div class="field"><label>剩余课时(可空)</label><input type="number" id="fRemain" placeholder="如 24" style="width:100px"></div>
      <div class="field" style="flex:1 1 100%;"><label>每周哪几天</label>
        <div class="weekday-picks" id="fWeekdays"></div>
      </div>
      <button class="btn small" type="submit" style="background:var(--accent);">＋ 添加课程</button>
    </form>
  </details>
</div>

<div class="sec">
  <details>
    <summary>📖 学习记录 · 复习本</summary>
    <div class="filter-chips" id="filterChips"></div>
    <form id="addEntryForm">
      <div class="field"><label>日期</label><input type="date" id="fDate"></div>
      <div class="field"><label>哪门课</label><select id="fClass"></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn small" type="submit" style="background:var(--accent);">＋ 记一笔</button></div>
      <textarea id="fNote" placeholder="今天学了什么？如：识字「大小上下」4个字；武术：马步+冲拳；英语：Unit2 单词跟读"></textarea>
    </form>
    <div id="historyArea" style="margin-top: 8px;"></div>
  </details>
</div>

<div class="sec">
  <details>
    <summary>💾 备份 / 恢复（换设备用）</summary>
    <div style="margin-top: 10px;">
      <button class="btn small" style="background:var(--accent);" onclick="doExport()">导出数据到下方文本框</button>
      <textarea id="ioArea" placeholder="点「导出」生成数据；换设备时把内容粘贴到这里，再点「导入」"></textarea>
      <button class="btn small miss" style="border:1.5px solid var(--line);" onclick="doImport()">导入</button>
      <p class="hint">数据自动保存在当前浏览器里（本机/本设备）。换 iPad 或换浏览器时，用这里的导出/导入搬数据。</p>
    </div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var KEY = "interestClassTracker.v1";
var DAY_NAMES = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
var COLORS = ["#7a9e7e", "#c98d6b", "#8a93b8", "#b0879a", "#6fa3a8", "#a3926f", "#8d8b84"];

var defaultData = {
  classes: [
    { id: "c_read",  emoji: "📖", name: "阅读", time: "",            weekdays: [1, 3], remaining: null },
    { id: "c_eng",   emoji: "🔤", name: "英语", time: "",            weekdays: [2, 5], remaining: null },
    { id: "c_wushu", emoji: "🥋", name: "武术", time: "17:30-18:30", weekdays: [4],    remaining: 31 },
    { id: "c_home",  emoji: "🏠", name: "家里学习", time: "", weekdays: [], remaining: null }
  ],
  records: []   // {date:"2026-09-10", classId, status:"attend"|"miss", note}
};

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultData));
    var d = JSON.parse(raw);
    if (!d.classes) return JSON.parse(JSON.stringify(defaultData));
    if (!d.classes.some(function (c) { return c.id === "c_home"; })) {
      d.classes.push(JSON.parse(JSON.stringify(defaultData.classes[3])));
    }
    return d;
  } catch (e) { return JSON.parse(JSON.stringify(defaultData)); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(DB)); }
var DB = load();

function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayWeekday() { var w = new Date().getDay(); return w === 0 ? 7 : w; }
function clsColor(cls) {
  var idx = DB.classes.indexOf(cls);
  return COLORS[(idx < 0 ? 0 : idx) % COLORS.length];
}
function classStats(cls) {
  var attend = 0, miss = 0;
  DB.records.forEach(function (r) { if (r.classId === cls.id) { if (r.status === "attend") attend++; else miss++; } });
  return { attend: attend, miss: miss, remaining: cls.remaining };
}
function isMarkedToday(clsId) {
  var t = todayISO();
  return DB.records.some(function (r) { return r.classId === clsId && r.date === t; });
}
function fmtDateCN(iso) {
  var p = iso.split("-");
  return p[0] + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
}

function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function () { el.classList.remove("show"); }, 1600);
}

function mark(clsId, status) {
  var cls = DB.classes.find(function (c) { return c.id === clsId; });
  if (!cls) return;
  var t = todayISO();
  if (isMarkedToday(clsId)) { toast(cls.name + "：今天已经记过啦"); return; }
  var rec = { date: t, classId: clsId, status: status, note: "" };
  DB.records.push(rec);
  if (status === "attend" && typeof cls.remaining === "number" && cls.remaining > 0) cls.remaining -= 1;
  if (status === "attend") {
    var note = prompt("「" + cls.name + "」今天学了什么？（方便以后复习，可留空）", "");
    if (note !== null && note.trim()) rec.note = note.trim();
  }
  save(); renderAll();
  toast(status === "attend" ? (cls.name + " 已记 ✓" + (typeof cls.remaining === "number" ? "　剩余 " + cls.remaining + " 节" : "")) : (cls.name + " 缺勤，不扣课时"));
}

function undoRecord(idx) {
  var r = DB.records[idx];
  if (!r) return;
  var cls = DB.classes.find(function (c) { return c.id === r.classId; });
  if (r.status === "attend" && cls && typeof cls.remaining === "number") cls.remaining += 1;
  DB.records.splice(idx, 1);
  save(); renderAll(); toast("已撤销一条记录");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
function findRecordToday(clsId) {
  var t = todayISO();
  for (var i = DB.records.length - 1; i >= 0; i--) {
    if (DB.records[i].classId === clsId && DB.records[i].date === t) return DB.records[i];
  }
  return null;
}
window.editTodayNote = function (clsId) {
  var rec = findRecordToday(clsId);
  if (!rec) return;
  var v = prompt("今天学了什么？", rec.note || "");
  if (v === null) return;
  rec.note = v.trim();
  save(); renderAll();
};

/* ── 渲染 ── */
function renderToday() {
  var area = document.getElementById("todayArea");
  var tw = todayWeekday();
  var list = DB.classes.filter(function (c) { return c.weekdays.indexOf(tw) !== -1; });
  if (!list.length) { area.innerHTML = '<div class="empty">今天没有安排兴趣班，好好玩 🌈</div>'; return; }
  area.innerHTML = "";
  list.forEach(function (cls) {
    var st = classStats(cls);
    var card = document.createElement("div");
    card.className = "card today-card";
    var pill = (typeof st.remaining === "number") ? '<span class="remaining-pill" style="background:' + clsColor(cls) + '">剩 ' + st.remaining + ' 节</span>' : "";
    var todayNote = "";
    DB.records.forEach(function (r) { if (r.classId === cls.id && r.date === todayISO() && r.note) todayNote = r.note; });
    card.innerHTML =
      '<div class="cls"><span class="cls-emoji">' + cls.emoji + '</span><span class="cls-name">' + cls.name + '</span>' + pill +
      '<div class="cls-meta">' + (cls.time || "时间自定") + '</div></div>' +
      (isMarkedToday(cls.id)
        ? '<div class="done-note" style="flex:1 1 100%;"><div>今天已记 ✓' +
          (todayNote ? '：<span class="note-text">' + escapeHtml(todayNote) + "</span>" : "") +
          '</div><button class="link-btn buji">✏️ 补记/修改今天学了什么</button></div>'
        : '<button class="btn attend" data-a="attend">✓ 上了</button><button class="btn miss" data-a="miss">没上</button>');
    card.querySelectorAll("button[data-a]").forEach(function (b) {
      b.addEventListener("click", function () { mark(cls.id, b.getAttribute("data-a")); });
    });
    var buji = card.querySelector(".buji");
    if (buji) buji.addEventListener("click", function () { editTodayNote(cls.id); });
    area.appendChild(card);
  });
}

function renderWeek() {
  var area = document.getElementById("weekArea");
  var tw = todayWeekday();
  var html = "";
  for (var d = 1; d <= 7; d++) {
    var list = DB.classes.filter(function (c) { return c.weekdays.indexOf(d) !== -1; });
    var chips = list.length
      ? list.map(function (c) {
          return '<span class="chip" style="background:' + clsColor(c) + '">' + c.emoji + " " + c.name + (c.time ? '<span class="t">' + c.time + "</span>" : "") + "</span>";
        }).join("")
      : '<span style="color:var(--muted);font-size:13px;">—</span>';
    html += '<div class="day-row' + (d === tw ? " today" : "") + '"><div class="day-label">' + DAY_NAMES[d] + (d === tw ? "·今" : "") + '</div><div class="chips">' + chips + "</div></div>";
  }
  area.innerHTML = html;
}

function renderStats() {
  var body = document.getElementById("statsBody");
  body.innerHTML = "";
  DB.classes.forEach(function (cls, i) {
    var st = classStats(cls);
    var tr = document.createElement("tr");
    tr.innerHTML =
      "<td>" + cls.emoji + " " + cls.name + "</td>" +
      "<td>" + (cls.time || "—") + "</td>" +
      "<td>" + (cls.weekdays.length ? cls.weekdays.map(function (w) { return DAY_NAMES[w]; }).join("、") : "—") + "</td>" +
      '<td style="color:var(--green);font-weight:600;">' + st.attend + "</td>" +
      "<td>" + st.miss + "</td>" +
      "<td>" + (typeof st.remaining === "number" ? "<b>" + st.remaining + "</b>" : "不限") + "</td>" +
      "<td>" +
        '<button class="link-btn" onclick="editRemain(' + i + ')">改剩余</button>' +
        '<button class="link-btn danger" onclick="removeClass(' + i + ')">删除</button>' +
      "</td>";
    body.appendChild(tr);
  });
  if (!DB.classes.length) body.innerHTML = '<tr><td colspan="7" class="empty">还没有课程，下面添加一个吧</td></tr>';
}

var curFilter = "all";
function renderHistory() {
  // 筛选条
  var chips = document.getElementById("filterChips");
  var chipsHtml = '<button data-f="all" class="' + (curFilter === "all" ? "on" : "") + '">全部</button>';
  DB.classes.forEach(function (c) {
    chipsHtml += '<button data-f="' + c.id + '" class="' + (curFilter === c.id ? "on" : "") + '">' + c.emoji + " " + c.name + "</button>";
  });
  chips.innerHTML = chipsHtml;
  chips.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { curFilter = b.getAttribute("data-f"); renderHistory(); });
  });
  // 手动记一笔：课程下拉
  var sel = document.getElementById("fClass");
  sel.innerHTML = DB.classes.map(function (c) { return '<option value="' + c.id + '">' + c.emoji + " " + c.name + "</option>"; }).join("");
  if (!document.getElementById("fDate").value) document.getElementById("fDate").value = todayISO();

  // 记录列表（按日期倒序）
  var area = document.getElementById("historyArea");
  var list = DB.records.map(function (r, i) { return { r: r, idx: i }; });
  if (curFilter !== "all") list = list.filter(function (x) { return x.r.classId === curFilter; });
  if (!list.length) { area.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  list.sort(function (a, b) { return a.r.date < b.r.date ? 1 : (a.r.date > b.r.date ? -1 : b.idx - a.idx); });
  var html = "";
  list.forEach(function (x) {
    var r = x.r, realIdx = x.idx;
    var cls = DB.classes.find(function (c) { return c.id === r.classId; });
    var name = cls ? cls.emoji + " " + cls.name : "（已删课程）";
    html += '<div class="history-item" style="flex-wrap:wrap;"><div style="flex:1 1 auto;">' + name +
      '　<span class="' + (r.status === "attend" ? "tag-attend" : "tag-miss") + '">' + (r.status === "attend" ? "已学" : "缺勤") + "</span>" +
      (r.note ? '<div class="entry-note">' + escapeHtml(r.note) + "</div>" : "") +
      '</div><div style="display:flex;align-items:center;gap:8px;"><span class="sub">' + fmtDateCN(r.date) + '</span>' +
      '<button class="link-btn" onclick="editNote(' + realIdx + ')">✏️</button>' +
      '<button class="link-btn danger" onclick="undoRecord(' + realIdx + ')">撤销</button></div></div>';
  });
  area.innerHTML = html;
}
window.editNote = function (i) {
  var r = DB.records[i];
  if (!r) return;
  var v = prompt("修改内容：", r.note || "");
  if (v === null) return;
  r.note = v.trim();
  save(); renderAll();
};
document.getElementById("addEntryForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var clsId = document.getElementById("fClass").value;
  var date = document.getElementById("fDate").value || todayISO();
  var note = document.getElementById("fNote").value.trim();
  var cls = DB.classes.find(function (c) { return c.id === clsId; });
  if (!cls) { toast("先添加课程"); return; }
  if (!note) { toast("写点什么吧，复习要用"); return; }
  DB.records.push({ date: date, classId: clsId, status: "attend", note: note });
  if (typeof cls.remaining === "number" && cls.remaining > 0 && date === todayISO() && !isMarkedToday(clsId)) {
    cls.remaining -= 1;   // 手动补记今天的课也算一节
  }
  document.getElementById("fNote").value = "";
  save(); renderAll(); toast("已记入 " + cls.name);
});

function renderAll() { renderToday(); renderWeek(); renderStats(); renderHistory(); }

/* ── 管理操作 ── */
window.editRemain = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  var v = prompt("「" + cls.name + "」剩余课时（留空 = 不限/不统计）：", typeof cls.remaining === "number" ? cls.remaining : "");
  if (v === null) return;
  cls.remaining = v.trim() === "" ? null : Math.max(0, parseInt(v, 10) || 0);
  save(); renderAll(); toast("已更新");
};
window.removeClass = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  if (!confirm("删除「" + cls.name + "」？历史打卡记录会保留但显示为（已删课程）")) return;
  DB.classes.splice(i, 1);
  save(); renderAll(); toast("已删除");
};

(function buildWeekdayPicks() {
  var box = document.getElementById("fWeekdays");
  var html = "";
  for (var d = 1; d <= 7; d++) {
    html += '<label><input type="checkbox" value="' + d + '">' + DAY_NAMES[d] + "</label>";
  }
  box.innerHTML = html;
})();

document.getElementById("addForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var name = document.getElementById("fName").value.trim();
  var weekdays = Array.prototype.map.call(document.querySelectorAll("#fWeekdays input:checked"), function (c) { return parseInt(c.value, 10); });
  if (!name) { toast("写个课程名吧"); return; }
  if (!weekdays.length) { toast("至少选一天"); return; }
  var remain = document.getElementById("fRemain").value.trim();
  DB.classes.push({
    id: "c_" + Date.now(),
    emoji: document.getElementById("fEmoji").value.trim() || "⭐",
    name: name,
    time: document.getElementById("fTime").value.trim(),
    weekdays: weekdays,
    remaining: remain === "" ? null : Math.max(0, parseInt(remain, 10) || 0)
  });
  save(); renderAll();
  document.getElementById("fName").value = ""; document.getElementById("fTime").value = ""; document.getElementById("fRemain").value = "";
  toast("已添加「" + name + "」");
});

/* ── 备份 ── */
window.doExport = function () {
  document.getElementById("ioArea").value = JSON.stringify(DB);
  document.getElementById("ioArea").select();
  toast("已生成，全选复制即可");
};
window.doImport = function () {
  var txt = document.getElementById("ioArea").value.trim();
  if (!txt) { toast("先把导出的数据粘贴进来"); return; }
  try {
    var d = JSON.parse(txt);
    if (!d.classes) throw 0;
    DB = d; save(); renderAll(); toast("导入成功 ✓");
  } catch (e) { toast("数据格式不对，导入失败"); }
};

/* ── 初始化 ── */
(function init() {
  var d = new Date();
  document.getElementById("todayStr").textContent = fmtDateCN(todayISO()) + " · " + DAY_NAMES[todayWeekday()];
  renderAll();
})();
</script>
</body>
</html>

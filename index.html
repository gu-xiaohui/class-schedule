<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>兴趣班课程表</title>
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --ink: #2c2c2c; --muted: #8d8b84;
    --line: #e4e2dc; --green: #417f55; --red: #8a4c46; --accent: #68614b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5;
    max-width: 760px; margin: 0 auto; padding: 16px 14px 60px;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 22px; letter-spacing: 1px; }
  #todayStr { color: var(--muted); font-size: 13px; }
  .sec { margin-top: 18px; }
  .sec > h2 { font-size: 15px; color: var(--accent); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }

  /* 今日打卡卡 */
  .today-card { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .today-card .cls { flex: 1 1 140px; }
  .cls-emoji { font-size: 26px; margin-right: 6px; }
  .cls-name { font-size: 17px; font-weight: 600; }
  .cls-meta { font-size: 12px; color: var(--muted); }
  .remaining-pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; color: #fff; margin-left: 6px; vertical-align: 2px; }
  .btn {
    border: none; border-radius: 12px; padding: 12px 18px; font-size: 15px; font-weight: 600;
    cursor: pointer; min-height: 46px; color: #fff;
  }
  .btn.attend { background: var(--green); }
  .btn.miss { background: transparent; color: var(--muted); border: 1.5px solid var(--line); }
  .btn.small { padding: 8px 12px; font-size: 13px; min-height: 38px; font-weight: 500; }
  .done-note { font-size: 13px; color: var(--green); }
  .empty { color: var(--muted); font-size: 14px; padding: 6px 2px; }

  /* 周视图 */
  .day-row { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--line); }
  .day-row.today { border-color: var(--accent); background: #fbfaf7; }
  .day-label { width: 46px; flex: none; font-weight: 700; font-size: 14px; }
  .day-row.today .day-label { color: var(--accent); }
  .day-date { display: block; font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; padding: 6px 12px; border-radius: 999px; color: #fff; cursor: pointer; }
  .chip .t { font-size: 11px; opacity: .9; font-weight: 400; }

  /* 课程记录弹层 */
  .class-modal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .class-sheet { background: #fff; border-radius: 18px 18px 0 0; width: 100%; max-width: 760px; max-height: 78vh; overflow-y: auto; padding: 14px 16px 30px; }
  .class-sheet h3 { display: flex; justify-content: space-between; align-items: center; font-size: 17px; margin-bottom: 6px; }
  .class-sheet .close-x { background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer; padding: 4px 8px; }

  /* 统计与管理 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td .ops { display: flex; gap: 6px; }
  .link-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 6px 8px; }
  .link-btn.danger { color: var(--red); }

  details { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  details > summary { cursor: pointer; font-weight: 600; font-size: 15px; color: var(--accent); }
  form.add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 12px; color: var(--muted); }
  input[type=text], input[type=time], input[type=number], input[type=date], select {
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; background: #fff; min-height: 44px;
  }
  .weekday-picks { display: flex; gap: 4px; flex-wrap: wrap; }
  .weekday-picks label { border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 10px; font-size: 13px; cursor: pointer; user-select: none; }
  .weekday-picks input { display: none; }
  .weekday-picks label:has(input:checked) { background: var(--accent); color: #fff; border-color: var(--accent); }

  .history-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .history-item .sub { color: var(--muted); font-size: 12px; }
  .note-text { color: var(--ink); font-size: 14px; margin-top: 2px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .filter-chips button { border: 1.5px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .filter-chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .entry-note { background: #f8f7f4; border-radius: 10px; padding: 8px 10px; margin-top: 4px; font-size: 14px; }
  #addEntryForm { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: flex-end; }
  #addEntryForm textarea { flex: 1 1 100%; height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit; background: #fff; }
  .jump-stats { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
  .jump-stats b { color: var(--ink); font-size: 16px; }
  .jump-week { display: flex; gap: 6px; }
  .jm { flex: 1; text-align: center; padding: 7px 0 6px; border-radius: 9px; background: #f0efec; color: var(--muted); font-size: 13px; }
  .jm .jm-ic { display: block; font-size: 20px; line-height: 1.15; font-style: normal; }
  .jm b { display: block; font-size: 11px; font-weight: 500; margin-top: 1px; }
  .jm.on { background: var(--green); color: #fff; }
  .jm.on b { font-weight: 600; }

  /* 打卡奖励弹层（灭火器） */
  .reward-overlay {
    position: fixed; inset: 0; z-index: 99;
    background: rgba(255, 255, 255, .82); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: fadeOut .3s ease 1.9s forwards; cursor: pointer;
  }
  .reward-emoji { font-size: 96px; line-height: 1; animation: bounceIn .7s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
  .reward-title { margin-top: 14px; font-size: 22px; font-weight: 700; color: var(--ink); animation: riseIn .5s ease .25s both; }
  .reward-sub { margin-top: 6px; font-size: 15px; color: var(--accent); font-weight: 600; animation: riseIn .5s ease .45s both; }
  .reward-spark { position: absolute; font-size: 26px; animation: sparkle 1.2s ease infinite alternate; }
  @keyframes bounceIn { 0% { transform: scale(.2) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.15) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes riseIn { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  @keyframes sparkle { from { transform: scale(.7) rotate(-12deg); opacity: .4; } to { transform: scale(1.2) rotate(10deg); opacity: 1; } }
  .tag-attend { color: var(--green); font-weight: 600; }
  .tag-miss { color: var(--muted); }

  textarea { width: 100%; height: 90px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12px; font-family: monospace; margin-top: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px; background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9; }
  .toast.show { opacity: .95; }

  /* 学习记录照片 */
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .thumbs .add-ph { width: 64px; height: 64px; border: 1.5px dashed var(--line); border-radius: 8px; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  #fPhotoPrev { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #fPhotoPrev img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .photo-view { position: fixed; inset: 0; z-index: 99; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; cursor: zoom-out; }
  .photo-view img { max-width: 96vw; max-height: 92vh; border-radius: 6px; }

  /* 识字卡片 */
  .card-group { background: #f8f7f4; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .card-group .cg-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .card-group .cg-title { font-weight: 700; font-size: 15px; }
  .cg-grid { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cg-grid .cell { position: relative; width: 68px; height: 68px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; }
  .cg-grid .cell img { width: 100%; height: 100%; object-fit: cover; }
  .cg-grid .cell .tick { position: absolute; right: 3px; bottom: 3px; background: rgba(65,127,85,.92); color: #fff; font-size: 11px; border-radius: 6px; padding: 0 5px; }
  .cg-grid .cell .del { position: absolute; left: 3px; top: 3px; background: rgba(0,0,0,.45); color: #fff; font-size: 11px; border-radius: 6px; padding: 0 5px; }
  .cg-grid .cell.add { display: flex; align-items: center; justify-content: center; border: 1.5px dashed var(--line); background: none; color: var(--muted); font-size: 24px; cursor: pointer; }
  .review-ov { position: fixed; inset: 0; z-index: 90; background: #101311; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; }
  .review-ov .rv-count { color: #cfd6d0; font-size: 14px; }
  .review-ov .rv-img-box { flex: 0 1 auto; display: flex; align-items: center; justify-content: center; width: 100%; }
  .review-ov img { max-width: 92vw; max-height: 62vh; border-radius: 12px; }
  .review-ov .rv-btns { display: flex; gap: 14px; width: 100%; max-width: 480px; }
  .review-ov .rv-btns .btn { flex: 1; font-size: 17px; min-height: 54px; }
  .review-ov .rv-close { position: absolute; top: 14px; right: 16px; background: none; border: none; color: #8b938d; font-size: 22px; cursor: pointer; }
  .cv-nav { display: flex; gap: 10px; width: 100%; max-width: 520px; }
  .cv-nav .btn { flex: 1; font-size: 16px; min-height: 50px; }
  .cv-nav .btn.mid { flex: 1.2; }
</style>
</head>
<body>
<header>
  <h1>兴趣班课程表</h1>
  <div id="todayStr"></div>
</header>

<div class="sec sec-today">
  <h2>📍 今天的课</h2>
  <div id="todayArea"></div>
</div>

<div class="sec sec-week">
  <h2>🗓 每周安排</h2>
  <div id="weekArea"></div>
</div>

<div class="sec sec-jump">
  <h2>🏃 每日跳绳</h2>
  <div id="jumpArea"></div>
</div>

<div class="sec sec-cards">
  <details id="cardsBox">
    <summary>🃏 识字卡片 · 归类复习</summary>
    <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
      <button class="btn small" style="background:var(--accent);" onclick="addCardGroup()">＋ 新建分组</button>
      <button class="btn small attend" onclick="startReview('all')">▶ 开始复习（全部）</button>
      <button class="btn small miss" onclick="startReview('unknown')">▶ 只复习不会的</button>
      <button class="btn small miss" style="border:1.5px solid var(--line);" onclick="importCloudCards()">☁️ 导入云端字卡包</button>
    </div>
    <div class="hint" id="cardsStats"></div>
    <div id="cardsArea"></div>
  </details>
</div>

<div class="sec sec-stats">
  <details>
    <summary>📊 课程与课时统计 · 添加 / 编辑</summary>
    <div style="overflow-x:auto; margin-top: 10px;">
      <table>
        <thead><tr><th>课程</th><th>时间</th><th>周几</th><th>已上</th><th>缺勤</th><th>剩余 / 待结</th><th>操作</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
    <form class="add-form" id="addForm">
      <div class="field"><label>图标</label><input type="text" id="fEmoji" value="⭐" style="width:52px;text-align:center"></div>
      <div class="field"><label>课程名</label><input type="text" id="fName" placeholder="如：围棋" required></div>
      <div class="field"><label>时间(可空)</label><input type="text" id="fTime" placeholder="17:30-18:30" style="width:130px"></div>
      <div class="field"><label>计费方式</label>
        <select id="fBilling">
          <option value="prepaid">课时包（有剩余节数）</option>
          <option value="postpaid">先上后结（按次计费）</option>
          <option value="none">不统计费用</option>
        </select>
      </div>
      <div class="field"><label>剩余课时(课时包填)</label><input type="number" id="fRemain" placeholder="如 24" style="width:100px"></div>
      <div class="field"><label>单价元/节(后结填)</label><input type="number" id="fPrice" placeholder="如 45" style="width:100px"></div>
      <div class="field" style="flex:1 1 100%;"><label>每周哪几天</label>
        <div class="weekday-picks" id="fWeekdays"></div>
      </div>
      <button class="btn small" type="submit" style="background:var(--accent);">＋ 添加课程</button>
    </form>
  </details>
</div>

<div class="sec sec-review">
  <details>
    <summary>📖 学习记录 · 复习本</summary>
    <div class="filter-chips" id="filterChips"></div>
    <form id="addEntryForm">
      <div class="field"><label>日期</label><input type="date" id="fDate"></div>
      <div class="field"><label>哪门课</label><select id="fClass"></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn small" type="button" onclick="document.getElementById('fPhotos').click()">📷 加照片</button></div>
      <div class="field"><label>&nbsp;</label><button class="btn small" type="submit" style="background:var(--accent);">＋ 记一笔</button></div>
      <textarea id="fNote" placeholder="今天学了什么？如：识字「大小上下」4个字；武术：马步+冲拳；英语：Unit2 单词跟读"></textarea>
      <input type="file" id="fPhotos" accept="image/*" multiple style="display:none">
      <div id="fPhotoPrev"></div>
    </form>
    <div id="historyArea" style="margin-top: 8px;"></div>
  </details>
</div>

<div class="sec sec-backup">
  <details>
    <summary>💾 备份 / 恢复（换设备用）</summary>
    <div style="margin-top: 10px;">
      <button class="btn small" style="background:var(--accent);" onclick="doExport()">导出数据到下方文本框</button>
      <textarea id="ioArea" placeholder="点「导出」生成数据；换设备时把内容粘贴到这里，再点「导入」"></textarea>
      <button class="btn small miss" style="border:1.5px solid var(--line);" onclick="doImport()">导入</button>
      <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn small attend" onclick="exportBackup()">📦 导出备份文件（含照片）</button>
        <button class="btn small miss" style="border:1.5px solid var(--line);" onclick="importBackup()">📥 从备份文件恢复</button>
      </div>
      <p class="hint">数据自动保存在当前浏览器里（本机/本设备）。换 iPad 或换浏览器时，用这里的导出/导入搬数据。</p>
      <p class="hint"><b>备份文件（含照片）</b>：一键打包全部记录、课时、跳绳、识字卡片和照片成一个文件——手机导出后可 AirDrop 到电脑或存"文件"App；在电脑浏览器打开本页点「从备份文件恢复」，电脑上就有完整一份。</p>
    </div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var KEY = "interestClassTracker.v1";
var DAY_NAMES = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];
var COLORS = ["#7a9e7e", "#c98d6b", "#8a93b8", "#b0879a", "#6fa3a8", "#a3926f", "#8d8b84"];

var defaultData = {
  v: 8,
  cards: { groups: [] },   // 识字卡片：[{id, name, cards:[{img, known}]}]
  jump: { days: { "2026-09-08": 10, "2026-09-09": 30 } },   // "2026-09-10": 180 —— 每日跳绳：日期→个数(0=只记完成)
  classes: [
    { id: "c_read",  emoji: "📖", name: "阅读", time: "",            weekdays: [1, 3], remaining: null, billing: "postpaid", price: 45, paid: 0 },
    { id: "c_eng",   emoji: "🔤", name: "英语", time: "",            weekdays: [2, 5], remaining: null, billing: "postpaid", price: 45, paid: 0 },
    { id: "c_wushu", emoji: "🥋", name: "武术", time: "17:30-18:30", weekdays: [4],    remaining: 31,  billing: "prepaid" },
    { id: "c_home",  emoji: "🏠", name: "家里学习", time: "", weekdays: [], remaining: null, billing: "none" }
  ],
  records: [
    { date: "2026-09-07", classId: "c_read", status: "miss",   note: "" },
    { date: "2026-09-08", classId: "c_eng",  status: "attend", note: "" },
    { date: "2026-09-09", classId: "c_read", status: "attend", note: "" },
    { date: "2026-09-10", classId: "c_wushu", status: "attend", note: "体能、侧手翻、跳绳。开始有点抵触，老师开导后好转" },
    { date: "2026-09-11", classId: "c_eng",  status: "attend", note: "" },
    { date: "2026-09-14", classId: "c_read", status: "attend", note: "" }
  ]
};

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultData));
    var d = JSON.parse(raw);
    if (!d.classes) return JSON.parse(JSON.stringify(defaultData));
    if ((d.v || 1) < 2) {
      // v1 → v2：补家里学习；阅读/英语改为先上后结45元；老数据没记录则补本周初始记录
      if (!d.classes.some(function (c) { return c.id === "c_home"; })) {
        d.classes.push(JSON.parse(JSON.stringify(defaultData.classes[3])));
      }
      d.classes.forEach(function (c) {
        if (c.id === "c_read" || c.id === "c_eng") { c.billing = "postpaid"; c.price = 45; c.paid = c.paid || 0; }
        if (c.id === "c_wushu") c.billing = "prepaid";
      });
      if (!d.records || !d.records.length) d.records = JSON.parse(JSON.stringify(defaultData.records));
    }
    if ((d.v || 1) < 3) {
      // v2 → v3：每日跳绳
      d.jump = d.jump || { days: {} };
    }
    if ((d.v || 1) < 4) {
      // v3 → v4：补录 2026-09-08(二)10个、2026-09-09(三)30个（已有该日记录则不覆盖）
      if (!d.jump) d.jump = { days: {} };
      [["2026-09-08", 10], ["2026-09-09", 30]].forEach(function (p) {
        if (d.jump.days[p[0]] === undefined) d.jump.days[p[0]] = p[1];
      });
    }
    if ((d.v || 1) < 5) {
      // v4 → v5：应用户要求移除 2026-09-10(周四)跳绳记录，便于重新打卡测试
      if (d.jump && d.jump.days && d.jump.days["2026-09-10"] !== undefined) delete d.jump.days["2026-09-10"];
    }
    if ((d.v || 1) < 6) {
      // v5 → v6：补录 2026-09-11(周五)英语已上（已有则跳过）
      var hasEng911 = (d.records || []).some(function (r) { return r.classId === "c_eng" && r.date === "2026-09-11"; });
      if (!hasEng911) d.records.push({ date: "2026-09-11", classId: "c_eng", status: "attend", note: "" });
    }
    if ((d.v || 1) < 7) {
      // v6 → v7：识字卡片模块
      d.cards = d.cards || { groups: [] };
    }
    if ((d.v || 1) < 8) {

        d.records.push({ date: "2026-09-10", classId: "c_wushu", status: "attend", note: "体能、侧手翻、跳绳。开始有点抵触，老师开导后好转" });
        var ws = d.classes && d.classes.filter(function (c) { return c.id === "c_wushu"; })[0];
        if (ws && ws.billing === "prepaid" && typeof ws.remaining === "number" && ws.remaining > 0) ws.remaining -= 1;

      if (!hasRead914) d.records.push({ date: "2026-09-14", classId: "c_read", status: "attend", note: "" });
    }

    return d;
  } catch (e) { return JSON.parse(JSON.stringify(defaultData)); }
}

function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayWeekday() { var w = new Date().getDay(); return w === 0 ? 7 : w; }
function clsColor(cls) {
  var idx = DB.classes.indexOf(cls);
  return COLORS[(idx < 0 ? 0 : idx) % COLORS.length];
}
function classStats(cls) {
  var attend = 0, miss = 0;
  DB.records.forEach(function (r) {
    if (r.classId === cls.id) {
      if (r.status === "attend") attend++;
      else if (r.status === "miss") miss++;
    }
  });
  var pending = null;
  if (cls.billing === "postpaid") {
    var unpaid = Math.max(0, attend - (cls.paid || 0));
    pending = unpaid * (cls.price || 0);
  }
  return { attend: attend, miss: miss, remaining: cls.remaining, pending: pending, unpaid: cls.billing === "postpaid" ? Math.max(0, attend - (cls.paid || 0)) : null };
}

function dstr(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function jumpStreak() {
  var d = new Date();
  if (!DB.jump.days[dstr(d)]) d.setDate(d.getDate() - 1);   // 今天还没跳：从昨天往前算
  var n = 0;
  while (DB.jump.days[dstr(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function jumpWeek() {
  var d = new Date();
  var wd = d.getDay() === 0 ? 7 : d.getDay();
  var monday = new Date(d); monday.setDate(d.getDate() - (wd - 1));
  var n = 0, marks = "";
  for (var i = 0; i < 7; i++) {
    var t = new Date(monday); t.setDate(monday.getDate() + i);
    var done = !!DB.jump.days[dstr(t)];
    if (done) n++;
    marks += '<span class="jm ' + (done ? "on" : "") + '" title="' + dstr(t) + '">' +
      (done ? '<i class="jm-ic">🧯</i>' : "") +
      "<b>" + DAY_NAMES[i + 1].replace("周", "") + "</b></span>";
  }
  return { n: n, marks: marks };
}
function jumpTotal() {
  var days = 0, sum = 0, last = 0;
  Object.keys(DB.jump.days).forEach(function (k) {
    days++; var c = DB.jump.days[k] || 0; sum += c;
    if (c > last) last = c;
  });
  return { days: days, sum: sum, avg: days ? Math.round(sum / days) : 0, last: last };
}
function lastJumpCount() {
  var v = 200;
  Object.keys(DB.jump.days).sort().forEach(function (k) { if (DB.jump.days[k] > 0) v = DB.jump.days[k]; });

}

/* ── 学习记录照片（IndexedDB 存储，本机保存）── */
var imgDB = null;
function openImgDB() {
  return new Promise(function (resolve) {
    var rq = indexedDB.open("classPhotos", 1);
    rq.onupgradeneeded = function (e) { e.target.result.createObjectStore("photos"); };
    rq.onsuccess = function (e) { imgDB = e.target.result; resolve(imgDB); };
    rq.onerror = function () { resolve(null); };
  });
}
function imgPut(blob) {
  return new Promise(function (resolve) {
    if (!imgDB) { resolve(null); return; }
    var id = "img_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var tx = imgDB.transaction("photos", "readwrite");
    tx.objectStore("photos").put(blob, id);
    tx.oncomplete = function () { resolve(id); };
    tx.onerror = function () { resolve(null); };
  });
}
function imgGet(id) {
  return new Promise(function (resolve) {
    if (!imgDB) { resolve(null); return; }
    try {
      var rq = imgDB.transaction("photos", "readonly").objectStore("photos").get(id);
      rq.onsuccess = function () { resolve(rq.result || null); };
      rq.onerror = function () { resolve(null); };
    } catch (e) { resolve(null); }
  });
}
function imgDel(id) {
  try { imgDB.transaction("photos", "readwrite").objectStore("photos").delete(id); } catch (e) {}
}
function compressImage(file) {
  return new Promise(function (resolve) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var maxEdge = 1280;
      var scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
      var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      var cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(function (b) { resolve(b || file); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

document.getElementById("fPhotos").addEventListener("change", function () {

window.addPhotosTo = function (idx) {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;

window.startReview = function (mode) {

/* ── 备份 ── */
function blobToDataURL(blob) {
  return new Promise(function (resolve) {
    var fr = new FileReader();
    fr.onload = function () { resolve(fr.result); };
    fr.onerror = function () { resolve(null); };
    fr.readAsDataURL(blob);
  });
}
async function dataURLtoBlob(durl) {
  try { return await (await fetch(durl)).blob(); } catch (e) { return null; }
}
function imgPutWithId(blob, id) {
  return new Promise(function (resolve) {
    if (!imgDB) { resolve(false); return; }
    try {
      var tx = imgDB.transaction("photos", "readwrite");
      tx.objectStore("photos").put(blob, id);
      tx.oncomplete = function () { resolve(true); };
      tx.onerror = function () { resolve(false); };
    } catch (e) { resolve(false); }
  });
}
window.exportBackup = async function () {
  toast("正在打包（照片多时稍等）…");

  DB.records.forEach(function (r) { (r.photos || []).forEach(function (id) { ids[id] = 1; }); });
  DB.cards.groups.forEach(function (g) { g.cards.forEach(function (c) { ids[c.img] = 1; }); });
  var photos = {};
  var keys = Object.keys(ids);
  for (var i = 0; i < keys.length; i++) {
    var b = await imgGet(keys[i]);
    if (b) photos[keys[i]] = await blobToDataURL(b);
  }
  var pack = { app: "classSchedule", exportedAt: todayISO(), db: DB, photos: photos };
  var blob = new Blob([JSON.stringify(pack)], { type: "application/json" });
  var d = new Date();
  var name = "kechengbiao_" + d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") + ".json";
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast("已导出 " + name + "（" + keys.length + " 张照片）");
};
window.importBackup = function () {
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = async function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    try {
      var data = JSON.parse(await f.text());
      if (data.app !== "classSchedule") throw new Error("格式");
      // 字卡导入包：只合并识字卡片分组和照片，不动其他数据
      if (data.cardsOnly) {
        if (!data.groups || !data.groups.length) throw new Error("空包");
        if (!confirm("导入字卡 " + data.groups.map(function (g) { return "「" + g.name + "」" + g.cards.length + " 张"; }).join("、") + "？现有数据不受影响。")) return;
        toast("正在导入照片（多时稍等）…");
        var entries = Object.entries(data.photos || {});
        for (var k = 0; k < entries.length; k++) {
          var bb = await dataURLtoBlob(entries[k][1]);
          if (bb) await imgPutWithId(bb, entries[k][0]);
        }
        data.groups.forEach(function (g) { DB.cards.groups.push(g); });
        save(); renderAll();
        toast("字卡导入完成 ✓ 共 " + entries.length + " 张");
        return;
      }
      if (!data.db || !data.db.classes) throw new Error("格式");
      if (!confirm("将用备份覆盖本机当前数据（含照片），确定恢复？")) return;
      toast("正在恢复照片…");
      var entries = Object.entries(data.photos || {});
      for (var i = 0; i < entries.length; i++) {
        var b = await dataURLtoBlob(entries[i][1]);
        if (b) await imgPutWithId(b, entries[i][0]);
      }
      DB = data.db;
      save(); renderAll();
      toast("恢复完成 ✓（" + entries.length + " 张照片）");
    } catch (e) { toast("备份文件不对，恢复失败"); }
  };
  inp.click();
};
window.doExport = function () {
  document.getElementById("ioArea").value = JSON.stringify(DB);
  document.getElementById("ioArea").select();
  toast("已生成，全选复制即可");
};
window.doImport = function () {
  var txt = document.getElementById("ioArea").value.trim();
  if (!txt) { toast("先把导出的数据粘贴进来"); return; }
  try {
    var d = JSON.parse(txt);
    if (!d.classes) throw 0;
    DB = d; save(); renderAll(); toast("导入成功 ✓");
  } catch (e) { toast("数据格式不对，导入失败"); }
};

/* ── 初始化 ── */
(function init() {
  var d = new Date();
  document.getElementById("todayStr").textContent = fmtDateCN(todayISO()) + " · " + DAY_NAMES[todayWeekday()];
  openImgDB().then(function () { renderAll(); });
})();
</script>
</body>

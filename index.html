<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>兴趣班课程表</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23faf2e4'/><path d='M12 4.6l2.3 4.7 5.2.8-3.8 3.6.9 5.2-4.6-2.4-4.6 2.4.9-5.2-3.8-3.6 5.2-.8z' fill='none' stroke='%2333291f' stroke-width='1.6' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf2e4; --card: #fffdf7; --ink: #33291f; --muted: #998e78;
    --line: #e7dcc6; --green: #4e9a5f; --red: #c65b4e; --accent: #e8684a;
    --honey: #f2b53a; --sky: #5b9bd9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--honey); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background-color: var(--bg);
    background-image: radial-gradient(#ecdfc6 1.3px, transparent 1.3px);
    background-size: 22px 22px;
    color: var(--ink); line-height: 1.55;
    max-width: 720px; margin: 0 auto; padding: 28px 16px 80px;
  }
  h1, .sec > h2, summary, .date-badge, .day-label { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; font-weight: 400; }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  header, .sec { animation: rise .5s cubic-bezier(.22, .8, .32, 1) both; }
  .sec:nth-of-type(1) { animation-delay: .06s; }
  .sec:nth-of-type(2) { animation-delay: .12s; }
  .sec:nth-of-type(3) { animation-delay: .18s; }
  .sec:nth-of-type(4) { animation-delay: .24s; }
  .sec:nth-of-type(5) { animation-delay: .3s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ── 页头 ── */
  header { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  h1 { font-size: 34px; letter-spacing: 3px; line-height: 1.2; }
  .squiggle { display: block; width: 150px; height: 12px; margin-top: 2px; }
  .date-badge {
    background: var(--card); border: 2px solid var(--ink); border-radius: 12px;
    box-shadow: 3px 3px 0 var(--ink); padding: 7px 14px; font-size: 15px;
    letter-spacing: 1px; transform: rotate(2deg);
  }

  /* ── 分区标题：贴纸标签 ── */
  .sec { margin-top: 30px; }
  .sec > h2 {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 19px; letter-spacing: 1px;
    background: var(--card); border: 2px solid var(--ink); border-radius: 12px;
    padding: 6px 16px; box-shadow: 3px 3px 0 var(--ink);
    transform: rotate(-1.2deg); margin-bottom: 16px;
  }
  .sec:nth-of-type(even) > h2 { transform: rotate(1deg); }

  .card { background: var(--card); border: 2px solid var(--ink); border-radius: 18px; padding: 16px; box-shadow: 5px 5px 0 var(--ink); }

  /* ── 今日打卡卡 ── */
  .today-card { position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .today-card::before {
    content: ""; position: absolute; top: -10px; left: 26px; width: 80px; height: 18px;
    border-radius: 3px; transform: rotate(-3deg);
    background: rgba(91, 155, 217, .45); border: 1px dashed rgba(51, 41, 31, .28);
  }
  .today-card:nth-child(even)::before { background: rgba(232, 104, 74, .4); left: auto; right: 26px; transform: rotate(2.5deg); }
  .today-card .cls { flex: 1 1 150px; }
  .cls-emoji {
    display: inline-flex; align-items: center; justify-content: center;
    width: 50px; height: 50px; font-size: 26px;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 15px;
    box-shadow: 3px 3px 0 var(--ink); transform: rotate(-4deg);
    vertical-align: middle; margin-right: 10px;
  }
  .cls-name { font-size: 18px; font-weight: 700; vertical-align: middle; }
  .cls-meta { font-size: 13px; color: var(--muted); margin: 6px 0 0 62px; }
  .remaining-pill {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px;
    border-radius: 999px; color: #fff; border: 2px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink); text-shadow: 0 1px 1px rgba(0, 0, 0, .18);
    margin-left: 8px; vertical-align: middle; transform: rotate(-3deg);
  }

  /* ── 按钮：可按下的贴纸 ── */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    border: 2px solid var(--ink); border-radius: 14px; padding: 12px 20px;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; min-height: 48px; color: #fff;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn.attend { background: var(--green); }
  .btn.miss { background: var(--card); color: var(--muted); border-color: var(--line); box-shadow: 3px 3px 0 var(--line); }
  .btn.miss:active { box-shadow: 0 0 0 var(--line); }
  .btn.small { padding: 9px 14px; font-size: 13px; min-height: 40px; font-weight: 600; border-radius: 11px; }
  .done-note { font-size: 14px; color: var(--green); font-weight: 600; }
  .empty { color: var(--muted); font-size: 14px; padding: 14px; border: 2px dashed var(--line); border-radius: 14px; text-align: center; background: rgba(255, 253, 247, .6); }
  td.empty { border: none; border-bottom: 2px dashed var(--line); text-align: left; padding: 10px 8px; }

  /* ── 周视图：票根条 ── */
  .day-row {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border-radius: 14px; margin-bottom: 10px;
    background: var(--card); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink);
  }
  .day-row.today { background: #fff7e8; box-shadow: 3px 3px 0 var(--accent); }
  .day-label { width: 68px; flex: none; font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
  .day-row.today .day-label { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 13px; font-weight: 600; padding: 5px 12px; border-radius: 999px;
    color: #fff; border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink);
    text-shadow: 0 1px 1px rgba(0, 0, 0, .18);
  }
  .chip .t { font-size: 11px; opacity: .92; font-weight: 400; }

  /* ── SVG 图标对齐 ── */
  svg.ic { display: block; flex: none; }
  .ic-text { display: inline-flex; align-items: center; gap: 6px; }
  .filter-chips button { display: inline-flex; align-items: center; gap: 5px; }
  .history-item svg.ic { display: inline; vertical-align: -2px; margin-right: 3px; }
  .empty svg.ic { display: inline; vertical-align: -4px; }
  .done-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cls-emoji { color: var(--ink); }
  @media (hover: hover) {
    .today-card, .day-row { transition: transform .15s ease, box-shadow .15s ease; }
    .today-card:hover, .day-row:hover { transform: translate(-1px, -2px); box-shadow: 6px 7px 0 var(--ink); }
    .day-row.today:hover { box-shadow: 6px 7px 0 var(--accent); }
  }

  /* ── 折叠卡片：胶带文件夹 ── */
  details {
    position: relative;
    background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
    padding: 16px 18px; box-shadow: 5px 5px 0 var(--ink);
  }
  details::before {
    content: ""; position: absolute; top: -11px; left: 28px; width: 96px; height: 20px;
    border-radius: 3px; transform: rotate(-2.5deg);
    background: rgba(242, 181, 58, .5); border: 1px dashed rgba(51, 41, 31, .3);
    transition: opacity .18s ease;
  }
  details.anim::before { opacity: 0; }
  .sec:nth-of-type(even) details::before { background: rgba(91, 155, 217, .45); left: auto; right: 30px; transform: rotate(2deg); }
  details > summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
    font-size: 17px; letter-spacing: 1px; color: var(--ink);
  }
  details > summary::-webkit-details-marker { display: none; }
  details > summary::after {
    content: "＋"; margin-left: auto; font-size: 19px;
    width: 30px; height: 30px; line-height: 26px; text-align: center; flex: none;
    border: 2px solid var(--ink); border-radius: 10px;
    background: var(--bg); box-shadow: 2px 2px 0 var(--ink);
    transition: transform .2s ease;
  }
  details[open] > summary::after { transform: rotate(45deg); }
  details[open] > summary { padding-bottom: 12px; border-bottom: 2px dashed var(--line); margin-bottom: 4px; }
  @keyframes detailIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  details[open] > *:not(summary) { animation: detailIn .32s ease both; }

  /* ── 表格 ── */
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 2px dashed var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: 1px; }
  tbody tr:last-child td { border-bottom: none; }
  td .ops { display: flex; gap: 6px; }
  .link-btn { display: inline-flex; align-items: center; gap: 4px; background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit; padding: 6px 8px; border-radius: 8px; }
  .link-btn:hover { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .link-btn.danger { color: var(--red); }

  /* ── 表单 ── */
  form.add-form { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .5px; }
  input[type=text], input[type=time], input[type=number], input[type=date], select {
    border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 15px; font-family: inherit; color: var(--ink);
    background: #fff; min-height: 44px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 3px 3px 0 var(--honey); }
  .weekday-picks { display: flex; gap: 6px; flex-wrap: wrap; }
  .weekday-picks label {
    border: 2px solid var(--line); border-radius: 11px; padding: 8px 12px;
    font-size: 13px; font-weight: 600; cursor: pointer; user-select: none;
    background: #fff; transition: all .15s ease;
  }
  .weekday-picks input { display: none; }
  .weekday-picks label:has(input:checked) {
    background: var(--accent); color: #fff; border-color: var(--ink);
    box-shadow: 2px 2px 0 var(--ink); transform: rotate(-2deg);
  }

  /* ── 学习记录 ── */
  .history-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 12px 2px; border-bottom: 2px dashed var(--line); font-size: 14px; }
  .history-item:last-child { border-bottom: none; }
  .history-item .sub { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .note-text { color: var(--ink); font-size: 14px; margin-top: 2px; }
  .filter-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
  .filter-chips button {
    border: 2px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .filter-chips button:hover { border-color: var(--ink); }
  .filter-chips button.on { background: var(--accent); color: #fff; border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
  .entry-note { background: var(--bg); border: 2px dashed var(--line); border-radius: 12px; padding: 9px 12px; margin-top: 6px; font-size: 14px; }
  #addEntryForm { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: flex-end; }
  #addEntryForm textarea {
    flex: 1 1 100%; height: 76px; border: 2px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 15px; font-family: inherit; background: #fff; resize: vertical;
  }
  .tag-attend { color: var(--green); font-weight: 700; }
  .tag-miss { color: var(--muted); font-weight: 600; }
  .tag-settle { color: var(--accent); font-weight: 700; }

  textarea {
    width: 100%; height: 96px; border: 2px solid var(--line); border-radius: 12px;
    padding: 12px; font-size: 12px; font-family: ui-monospace, Menlo, monospace;
    margin-top: 10px; background: #fff; resize: vertical;
  }
  textarea#ioArea { margin: 12px 0; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(6px); bottom: 28px;
    background: var(--ink); color: #fff; padding: 11px 22px; border-radius: 999px;
    font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; z-index: 9;
    box-shadow: 3px 3px 0 rgba(51, 41, 31, .25);
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: .97; transform: translateX(-50%) translateY(0); }

  @media (max-width: 480px) {
    body { padding: 18px 12px 70px; background-size: 18px 18px; }
    h1 { font-size: 26px; letter-spacing: 2px; }
    .squiggle { width: 120px; height: 10px; }
    .date-badge { font-size: 13px; padding: 6px 11px; }
    .sec { margin-top: 24px; }
    .sec > h2 { font-size: 16px; padding: 5px 13px; margin-bottom: 13px; }
    .card { padding: 13px; }
    .today-card { gap: 10px; margin-bottom: 13px; }
    .today-card .cls { flex: 1 1 100%; }
    .today-card .btn { padding: 11px 14px; }
    .today-card .btn.attend { flex: 2 1 0; }
    .today-card .btn.miss { flex: 1 1 0; }
    .cls-name { font-size: 17px; }
    .cls-emoji { width: 46px; height: 46px; border-radius: 13px; }
    .cls-meta { margin-left: 58px; }
    .day-row { padding: 9px 12px; gap: 10px; }
    .day-label { width: 58px; font-size: 14px; }
    .chip { font-size: 12.5px; padding: 4px 10px; }
    details { padding: 13px 14px; }
    details > summary { font-size: 15.5px; }
    th, td { padding: 8px 6px; font-size: 13px; }
    form.add-form .field { flex: 1 1 44%; }
    form.add-form .field input, form.add-form .field select { width: 100%; }
    #fEmoji { width: 100% !important; }
    #addEntryForm .field { flex: 1 1 40%; }
    #addEntryForm .field input, #addEntryForm .field select { width: 100%; }
    #addEntryForm .field:has(button) { flex: 1 1 100%; }
    #addEntryForm .field:has(button) .btn { width: 100%; }
    .filter-chips button { padding: 6px 12px; font-size: 12.5px; }
    .weekday-picks label { padding: 7px 10px; font-size: 12.5px; }
    .toast { max-width: calc(100vw - 32px); text-align: center; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>兴趣班课程表</h1>
    <svg class="squiggle" viewBox="0 0 150 12" preserveAspectRatio="none" aria-hidden="true">
      <path d="M3 8 Q 16 2, 30 7 T 58 7 T 86 7 T 114 7 T 147 6" fill="none" stroke="#e8684a" stroke-width="4.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div id="todayStr" class="date-badge"></div>
</header>

<div class="sec">
  <h2><svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>今天的课</h2>
  <div id="todayArea"></div>
</div>

<div class="sec">
  <h2><svg class="ic" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>每周安排</h2>
  <div id="weekArea"></div>
</div>

<div class="sec">
  <details>
    <summary><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7.5 20v-6M12 20V7M16.5 20v-9"/></svg>课程与课时统计 · 添加 / 编辑</summary>
    <div style="overflow-x:auto; margin-top: 10px;">
      <table>
        <thead><tr><th>课程</th><th>时间</th><th>周几</th><th>已上</th><th>缺勤</th><th>剩余 / 待结</th><th>操作</th></tr></thead>
        <tbody id="statsBody"></tbody>
      </table>
    </div>
    <form class="add-form" id="addForm">
      <div class="field"><label>图标</label><input type="text" id="fEmoji" value="⭐" style="width:52px;text-align:center"></div>
      <div class="field"><label>课程名</label><input type="text" id="fName" placeholder="如：围棋" required></div>
      <div class="field"><label>时间(可空)</label><input type="text" id="fTime" placeholder="17:30-18:30" style="width:130px"></div>
      <div class="field"><label>计费方式</label>
        <select id="fBilling">
          <option value="prepaid">课时包（有剩余节数）</option>
          <option value="postpaid">先上后结（按次计费）</option>
          <option value="none">不统计费用</option>
        </select>
      </div>
      <div class="field"><label>剩余课时(课时包填)</label><input type="number" id="fRemain" placeholder="如 24" style="width:100px"></div>
      <div class="field"><label>单价元/节(后结填)</label><input type="number" id="fPrice" placeholder="如 45" style="width:100px"></div>
      <div class="field" style="flex:1 1 100%;"><label>每周哪几天</label>
        <div class="weekday-picks" id="fWeekdays"></div>
      </div>
      <button class="btn small" type="submit" style="background:var(--accent);"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加课程</button>
    </form>
  </details>
</div>

<div class="sec">
  <details>
    <summary><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h4"/></svg>学习记录 · 复习本</summary>
    <div class="filter-chips" id="filterChips"></div>
    <form id="addEntryForm">
      <div class="field"><label>日期</label><input type="date" id="fDate"></div>
      <div class="field"><label>哪门课</label><select id="fClass"></select></div>
      <div class="field"><label>&nbsp;</label><button class="btn small" type="submit" style="background:var(--accent);"><svg class="ic" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>记一笔</button></div>
      <textarea id="fNote" placeholder="今天学了什么？如：识字「大小上下」4个字；武术：马步+冲拳；英语：Unit2 单词跟读"></textarea>
    </form>
    <div id="historyArea" style="margin-top: 8px;"></div>
  </details>
</div>

<div class="sec">
  <details>
    <summary><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M8.5 4v5h7V4"/><rect x="8.5" y="13" width="7" height="7"/></svg>备份 / 恢复（换设备用）</summary>
    <div style="margin-top: 10px;">
      <button class="btn small" style="background:var(--accent);" onclick="doExport()">导出数据到下方文本框</button>
      <textarea id="ioArea" placeholder="点「导出」生成数据；换设备时把内容粘贴到这里，再点「导入」"></textarea>
      <button class="btn small miss" onclick="doImport()">导入</button>
      <p class="hint">数据自动保存在当前浏览器里（本机/本设备）。换 iPad 或换浏览器时，用这里的导出/导入搬数据。</p>
    </div>
  </details>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
var KEY = "interestClassTracker.v1";

var COLORS = ["#df6a4f", "#d18a2d", "#4e9a5f", "#4f8fc9", "#8f6fc4", "#c9678a", "#7d8590"];

};
var EMOJI_ICONS = {
  "📖": "book", "📚": "book", "📕": "book",
  "🔤": "abc", "🅰️": "abc", "🇬🇧": "abc",
  "🥋": "burst", "🥊": "burst", "💪": "burst",
  "⚽": "ball", "🏀": "ball", "🏓": "ball", "🏸": "ball", "🏊": "ball",
  "🎨": "palette", "🖌️": "palette", "🖍️": "palette",
  "🎹": "music", "🎵": "music", "🎸": "music", "🎻": "music", "🥁": "music",
  "🏠": "home", "⭐": "star", "🌟": "star",
  "🤖": "robot", "🧮": "grid", "♟️": "grid", "✏️": "pencil"
};
function icon(name, size) {
  size = size || 20;
  return '<svg class="ic" viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || ICONS.star) + '</svg>';
}
function clsIcon(cls) { return EMOJI_ICONS[cls.emoji] || "star"; }

var defaultData = {
  v: 2,
  classes: [
    { id: "c_read",  emoji: "📖", name: "阅读", time: "",            weekdays: [1, 3], remaining: null, billing: "postpaid", price: 45, paid: 0 },
    { id: "c_eng",   emoji: "🔤", name: "英语", time: "",            weekdays: [2, 5], remaining: null, billing: "postpaid", price: 45, paid: 0 },
    { id: "c_wushu", emoji: "🥋", name: "武术", time: "17:30-18:30", weekdays: [4],    remaining: 31,  billing: "prepaid" },
    { id: "c_home",  emoji: "🏠", name: "家里学习", time: "", weekdays: [], remaining: null, billing: "none" }
  ],
  records: [
    { date: "2026-09-07", classId: "c_read", status: "miss",   note: "" },
    { date: "2026-09-08", classId: "c_eng",  status: "attend", note: "" },
    { date: "2026-09-09", classId: "c_read", status: "attend", note: "" }
  ]
};

function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(defaultData));
    var d = JSON.parse(raw);
    if (!d.classes) return JSON.parse(JSON.stringify(defaultData));
    if ((d.v || 1) < 2) {
      // v1 → v2：补家里学习；阅读/英语改为先上后结45元；老数据没记录则补本周初始记录
      if (!d.classes.some(function (c) { return c.id === "c_home"; })) {
        d.classes.push(JSON.parse(JSON.stringify(defaultData.classes[3])));
      }
      d.classes.forEach(function (c) {
        if (c.id === "c_read" || c.id === "c_eng") { c.billing = "postpaid"; c.price = 45; c.paid = c.paid || 0; }
        if (c.id === "c_wushu") c.billing = "prepaid";
      });
      if (!d.records || !d.records.length) d.records = JSON.parse(JSON.stringify(defaultData.records));
      d.v = 2;
    }
    return d;
  } catch (e) { return JSON.parse(JSON.stringify(defaultData)); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(DB)); }
var DB = load();
// 老数据迁移后立即落盘，避免下次打开重复迁移判断
(function persistIfMigrated() {
  var raw = localStorage.getItem(KEY);
  var stale = !raw;
  if (raw) { try { stale = (JSON.parse(raw).v || 1) < 2; } catch (e) {} }
  if (stale) save();
})();

function todayISO() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function todayWeekday() { var w = new Date().getDay(); return w === 0 ? 7 : w; }
function clsColor(cls) {
  var idx = DB.classes.indexOf(cls);
  return COLORS[(idx < 0 ? 0 : idx) % COLORS.length];
}
function classStats(cls) {
  var attend = 0, miss = 0;
  DB.records.forEach(function (r) {
    if (r.classId === cls.id) {
      if (r.status === "attend") attend++;
      else if (r.status === "miss") miss++;
    }
  });
  var pending = null, unpaid = null;
  if (cls.billing === "postpaid") {
    unpaid = Math.max(0, attend - (cls.paid || 0));
    pending = unpaid * (cls.price || 0);
  }
  return { attend: attend, miss: miss, remaining: cls.remaining, pending: pending, unpaid: unpaid };
}
function isMarkedToday(clsId) {
  var t = todayISO();
  return DB.records.some(function (r) { return r.classId === clsId && r.date === t; });
}
function fmtDateCN(iso) {
  var p = iso.split("-");
  return p[0] + "年" + Number(p[1]) + "月" + Number(p[2]) + "日";
}

function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(function () { el.classList.remove("show"); }, 1600);
}

function mark(clsId, status) {
  var cls = DB.classes.find(function (c) { return c.id === clsId; });
  if (!cls) return;
  var t = todayISO();
  if (isMarkedToday(clsId)) { toast(cls.name + "：今天已经记过啦"); return; }
  var rec = { date: t, classId: clsId, status: status, note: "" };
  DB.records.push(rec);
  if (status === "attend" && typeof cls.remaining === "number" && cls.remaining > 0) cls.remaining -= 1;
  if (status === "attend") {
    var note = prompt("「" + cls.name + "」今天学了什么？（方便以后复习，可留空）", "");
    if (note !== null && note.trim()) rec.note = note.trim();
  }
  save(); renderAll();
  var msg;
  if (status !== "attend") msg = cls.name + " 缺勤，不扣课时";
  else if (cls.billing === "postpaid") msg = cls.name + " 已记 ✓　待结 ¥" + classStats(cls).pending;
  else if (typeof cls.remaining === "number") msg = cls.name + " 已记 ✓　剩余 " + cls.remaining + " 节";
  else msg = cls.name + " 已记 ✓";
  toast(msg);
}

function undoRecord(idx) {
  var r = DB.records[idx];
  if (!r) return;
  var cls = DB.classes.find(function (c) { return c.id === r.classId; });
  if (r.status === "attend" && cls && cls.billing === "prepaid" && typeof cls.remaining === "number") cls.remaining += 1;
  if (r.status === "settle" && cls) cls.paid = Math.max(0, (cls.paid || 0) - (r.count || 0));
  DB.records.splice(idx, 1);
  save(); renderAll(); toast("已撤销一条记录");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (m) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
  });
}
function findRecordToday(clsId) {
  var t = todayISO();
  for (var i = DB.records.length - 1; i >= 0; i--) {
    if (DB.records[i].classId === clsId && DB.records[i].date === t) return DB.records[i];
  }
  return null;
}
window.editTodayNote = function (clsId) {
  var rec = findRecordToday(clsId);
  if (!rec) return;
  var v = prompt("今天学了什么？", rec.note || "");
  if (v === null) return;
  rec.note = v.trim();
  save(); renderAll();
};

/* ── 渲染 ── */
function renderToday() {
  var area = document.getElementById("todayArea");
  var tw = todayWeekday();
  var list = DB.classes.filter(function (c) { return c.weekdays.indexOf(tw) !== -1; });
  if (!list.length) { area.innerHTML = '<div class="empty">今天没有安排兴趣班，好好玩 ' + icon("rainbow", 18) + '</div>'; return; }
  area.innerHTML = "";
  list.forEach(function (cls) {
    var st = classStats(cls);
    var card = document.createElement("div");
    card.className = "card today-card";
    var pill;
    if (cls.billing === "postpaid") pill = '<span class="remaining-pill" style="background:' + clsColor(cls) + '">¥' + (cls.price || 0) + "／节 · 后结</span>";
    else if (typeof st.remaining === "number") pill = '<span class="remaining-pill" style="background:' + clsColor(cls) + '">剩 ' + st.remaining + " 节</span>";
    else pill = "";
    var todayNote = "";
    DB.records.forEach(function (r) { if (r.classId === cls.id && r.date === todayISO() && r.note) todayNote = r.note; });
    card.innerHTML =
      '<div class="cls"><span class="cls-emoji">' + icon(clsIcon(cls), 26) + '</span><span class="cls-name">' + cls.name + '</span>' + pill +
      '<div class="cls-meta">' + (cls.time || "时间自定") + '</div></div>' +
      (isMarkedToday(cls.id)
        ? '<div class="done-note" style="flex:1 1 100%;"><div class="done-line">今天已记 ' + icon("check", 15) +
          (todayNote ? '：<span class="note-text">' + escapeHtml(todayNote) + "</span>" : "") +
          '</div><button class="link-btn buji">' + icon("pencil", 13) + ' 补记/修改今天学了什么</button></div>'
        : '<button class="btn attend" data-a="attend">' + icon("check", 18) + ' 上了</button><button class="btn miss" data-a="miss">没上</button>');
    card.querySelectorAll("button[data-a]").forEach(function (b) {
      b.addEventListener("click", function () { mark(cls.id, b.getAttribute("data-a")); });
    });
    var buji = card.querySelector(".buji");
    if (buji) buji.addEventListener("click", function () { editTodayNote(cls.id); });
    area.appendChild(card);
  });
}

function renderWeek() {
  var area = document.getElementById("weekArea");
  var tw = todayWeekday();
  var html = "";
  for (var d = 1; d <= 7; d++) {
    var list = DB.classes.filter(function (c) { return c.weekdays.indexOf(d) !== -1; });
    var chips = list.length
      ? list.map(function (c) {
          return '<span class="chip" style="background:' + clsColor(c) + '">' + icon(clsIcon(c), 14) + " " + c.name + (c.time ? '<span class="t">' + c.time + "</span>" : "") + "</span>";
        }).join("")
      : '<span style="color:var(--muted);font-size:13px;">—</span>';
    html += '<div class="day-row' + (d === tw ? " today" : "") + '"><div class="day-label">' + DAY_NAMES[d] + (d === tw ? "·今" : "") + '</div><div class="chips">' + chips + "</div></div>";
  }
  area.innerHTML = html;
}

function renderStats() {
  var body = document.getElementById("statsBody");
  body.innerHTML = "";
  DB.classes.forEach(function (cls, i) {
    var st = classStats(cls);
    var countCell;
    if (cls.billing === "postpaid") {
      countCell = '<b style="color:var(--accent);">¥' + st.pending + "</b> <span class='sub'>（" + st.unpaid + " 节未结）</span>";
    } else if (typeof st.remaining === "number") {
      countCell = "<b>" + st.remaining + "</b> 节";
    } else {
      countCell = "不限";
    }
    var ops = "";
    if (cls.billing === "prepaid") ops += '<button class="link-btn" onclick="editRemain(' + i + ')">改剩余</button>';
    if (cls.billing === "postpaid") {
      ops += '<button class="link-btn" onclick="settle(' + i + ')">结算</button>';
      ops += '<button class="link-btn" onclick="editPrice(' + i + ')">改单价</button>';
    }
    ops += '<button class="link-btn danger" onclick="removeClass(' + i + ')">删除</button>';
    var tr = document.createElement("tr");
    tr.innerHTML =
      '<td><span class="ic-text">' + icon(clsIcon(cls), 16) + " " + cls.name + "</span></td>" +
      "<td>" + (cls.time || "—") + "</td>" +
      "<td>" + (cls.weekdays.length ? cls.weekdays.map(function (w) { return DAY_NAMES[w]; }).join("、") : "—") + "</td>" +
      '<td style="color:var(--green);font-weight:600;">' + st.attend + "</td>" +
      "<td>" + st.miss + "</td>" +
      "<td>" + countCell + "</td>" +
      "<td>" + ops + "</td>";
    body.appendChild(tr);
  });
  if (!DB.classes.length) body.innerHTML = '<tr><td colspan="7" class="empty">还没有课程，下面添加一个吧</td></tr>';
}

var curFilter = "all";
function renderHistory() {
  // 筛选条
  var chips = document.getElementById("filterChips");
  var chipsHtml = '<button data-f="all" class="' + (curFilter === "all" ? "on" : "") + '">全部</button>';
  DB.classes.forEach(function (c) {
    chipsHtml += '<button data-f="' + c.id + '" class="' + (curFilter === c.id ? "on" : "") + '">' + icon(clsIcon(c), 14) + " " + c.name + "</button>";
  });
  chips.innerHTML = chipsHtml;
  chips.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { curFilter = b.getAttribute("data-f"); renderHistory(); });
  });
  // 手动记一笔：课程下拉
  var sel = document.getElementById("fClass");
  sel.innerHTML = DB.classes.map(function (c) { return '<option value="' + c.id + '">' + c.emoji + " " + c.name + "</option>"; }).join("");
  if (!document.getElementById("fDate").value) document.getElementById("fDate").value = todayISO();

  // 记录列表（按日期倒序）
  var area = document.getElementById("historyArea");
  var list = DB.records.map(function (r, i) { return { r: r, idx: i }; });
  if (curFilter !== "all") list = list.filter(function (x) { return x.r.classId === curFilter; });
  if (!list.length) { area.innerHTML = '<div class="empty">还没有记录</div>'; return; }
  list.sort(function (a, b) { return a.r.date < b.r.date ? 1 : (a.r.date > b.r.date ? -1 : b.idx - a.idx); });
  var html = "";
  list.forEach(function (x) {
    var r = x.r, realIdx = x.idx;
    var cls = DB.classes.find(function (c) { return c.id === r.classId; });
    var name = cls ? icon(clsIcon(cls), 15) + " " + cls.name : "（已删课程）";
    var tagHtml;
    if (r.status === "attend") tagHtml = '<span class="tag-attend">已学</span>';
    else if (r.status === "settle") tagHtml = '<span class="tag-settle">' + icon("coin", 14) + " 已结算 " + (r.count || "") + " 节 · ¥" + (r.amount || "") + "</span>";
    else tagHtml = '<span class="tag-miss">缺勤</span>';
    html += '<div class="history-item" style="flex-wrap:wrap;"><div style="flex:1 1 auto;">' + name + "　" + tagHtml +
      (r.note ? '<div class="entry-note">' + escapeHtml(r.note) + "</div>" : "") +
      '</div><div style="display:flex;align-items:center;gap:8px;"><span class="sub">' + fmtDateCN(r.date) + '</span>' +
      '<button class="link-btn" onclick="editNote(' + realIdx + ')">' + icon("pencil", 13) + '</button>' +
      '<button class="link-btn danger" onclick="undoRecord(' + realIdx + ')">撤销</button></div></div>';
  });
  area.innerHTML = html;
}
window.editNote = function (i) {
  var r = DB.records[i];
  if (!r) return;
  var v = prompt("修改内容：", r.note || "");
  if (v === null) return;
  r.note = v.trim();
  save(); renderAll();
};
document.getElementById("addEntryForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var clsId = document.getElementById("fClass").value;
  var date = document.getElementById("fDate").value || todayISO();
  var note = document.getElementById("fNote").value.trim();
  var cls = DB.classes.find(function (c) { return c.id === clsId; });
  if (!cls) { toast("先添加课程"); return; }
  if (!note) { toast("写点什么吧，复习要用"); return; }
  DB.records.push({ date: date, classId: clsId, status: "attend", note: note });
  if (typeof cls.remaining === "number" && cls.remaining > 0 && date === todayISO() && !isMarkedToday(clsId)) {
    cls.remaining -= 1;   // 手动补记今天的课也算一节
  }
  document.getElementById("fNote").value = "";
  save(); renderAll(); toast("已记入 " + cls.name);
});

function renderAll() { renderToday(); renderWeek(); renderStats(); renderHistory(); }

/* ── 管理操作 ── */
window.editRemain = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  var v = prompt("「" + cls.name + "」剩余课时（留空 = 不限/不统计）：", typeof cls.remaining === "number" ? cls.remaining : "");
  if (v === null) return;
  cls.remaining = v.trim() === "" ? null : Math.max(0, parseInt(v, 10) || 0);
  save(); renderAll(); toast("已更新");
};
window.editPrice = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  var v = prompt("「" + cls.name + "」每节课单价（元）：", cls.price || 45);
  if (v === null) return;
  cls.price = Math.max(0, parseFloat(v) || 0);
  save(); renderAll(); toast("单价已改为 ¥" + cls.price);
};
window.settle = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  var st = classStats(cls);
  if (!st.unpaid) { toast("没有待结算的课时"); return; }
  if (!confirm("「" + cls.name + "」结算 " + st.unpaid + " 节 × ¥" + (cls.price || 0) + " = ¥" + st.pending + "，确认已付清？")) return;
  cls.paid = (cls.paid || 0) + st.unpaid;
  DB.records.push({ date: todayISO(), classId: cls.id, status: "settle", count: st.unpaid, amount: st.pending, note: "" });
  save(); renderAll(); toast("已结算 ¥" + st.pending);
};
window.removeClass = function (i) {
  var cls = DB.classes[i];
  if (!cls) return;
  if (!confirm("删除「" + cls.name + "」？历史打卡记录会保留但显示为（已删课程）")) return;
  DB.classes.splice(i, 1);
  save(); renderAll(); toast("已删除");
};

(function buildWeekdayPicks() {
  var box = document.getElementById("fWeekdays");
  var html = "";
  for (var d = 1; d <= 7; d++) {
    html += '<label><input type="checkbox" value="' + d + '">' + DAY_NAMES[d] + "</label>";
  }
  box.innerHTML = html;
})();

document.getElementById("addForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var name = document.getElementById("fName").value.trim();
  var weekdays = Array.prototype.map.call(document.querySelectorAll("#fWeekdays input:checked"), function (c) { return parseInt(c.value, 10); });
  if (!name) { toast("写个课程名吧"); return; }
  if (!weekdays.length) { toast("至少选一天"); return; }
  var remain = document.getElementById("fRemain").value.trim();
  var billing = document.getElementById("fBilling").value;
  var price = parseFloat(document.getElementById("fPrice").value) || 0;
  DB.classes.push({
    id: "c_" + Date.now(),
    emoji: document.getElementById("fEmoji").value.trim() || "⭐",
    name: name,
    time: document.getElementById("fTime").value.trim(),
    weekdays: weekdays,
    billing: billing,
    remaining: billing === "prepaid" && remain !== "" ? Math.max(0, parseInt(remain, 10) || 0) : null,
    price: billing === "postpaid" ? price : undefined,
    paid: 0
  });
  save(); renderAll();
  document.getElementById("fName").value = ""; document.getElementById("fTime").value = ""; document.getElementById("fRemain").value = ""; document.getElementById("fPrice").value = "";
  toast("已添加「" + name + "」");
});

/* ── 备份 ── */
window.doExport = function () {
  document.getElementById("ioArea").value = JSON.stringify(DB);
  document.getElementById("ioArea").select();
  toast("已生成，全选复制即可");
};
window.doImport = function () {
  var txt = document.getElementById("ioArea").value.trim();
  if (!txt) { toast("先把导出的数据粘贴进来"); return; }
  try {
    var d = JSON.parse(txt);
    if (!d.classes) throw 0;
    DB = d; save(); renderAll(); toast("导入成功 ✓");
  } catch (e) { toast("数据格式不对，导入失败"); }
};

/* ── 折叠面板展开动画 ── */
(function detailsAnim() {
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) return;
  document.querySelectorAll("details").forEach(function (d) {
    var summary = d.querySelector("summary");
    if (!summary) return;
    summary.addEventListener("click", function (e) {
      e.preventDefault();
      if (d.dataset.anim) return;
      d.dataset.anim = "1";
      d.classList.add("anim");
      var startH, endH, a;
      if (d.open) {
        startH = d.offsetHeight;
        d.open = false;
        endH = d.offsetHeight;
        d.open = true;
        d.style.overflow = "hidden";
        a = d.animate(
          [{ height: startH + "px" }, { height: endH + "px" }],
          { duration: 260, easing: "cubic-bezier(.22,.8,.32,1)" }
        );
        a.onfinish = function () {
          d.open = false;
          d.style.overflow = "";
          d.classList.remove("anim");
          delete d.dataset.anim;
        };
      } else {
        startH = d.offsetHeight;
        d.open = true;
        endH = d.offsetHeight;
        d.style.overflow = "hidden";
        a = d.animate(
          [{ height: startH + "px" }, { height: endH + "px" }],
          { duration: 300, easing: "cubic-bezier(.22,.8,.32,1)" }
        );
        a.onfinish = function () {
          d.style.overflow = "";
          d.classList.remove("anim");
          delete d.dataset.anim;
        };
      }
    });
  });
})();

/* ── 初始化 ── */
(function init() {
  var d = new Date();
  document.getElementById("todayStr").textContent = fmtDateCN(todayISO()) + " · " + DAY_NAMES[todayWeekday()];
  renderAll();
})();
</script>

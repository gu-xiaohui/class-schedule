<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>跳跳的每日打卡</title>
<style>
  :root {
    --paper: #F7F5F0; --card: #FFFFFF;
    --ink: #2B2A26; --muted: #8A867C; --ink-faint: #B4B0A6;
    --line: #EAE6DD;
    --pine: #2F4A3E; --pine-soft: #E7EFEA;
    --fresh: #37976D;
    --clay: #C0563B; --clay-soft: #F9EDE7;
    --gold: #E8A33D; --gold-soft: #FBF3E4;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.6;
    max-width: 560px; margin: 0 auto; padding: 0 14px 70px;
  }
  .cover { text-align: center; padding: 40px 0 4px; }
  .cover .eyebrow { font-size: 12px; letter-spacing: .35em; color: var(--clay); margin-bottom: 12px; padding-left: .35em; }
  .cover h1 { font-family: var(--serif); font-size: 32px; font-weight: 700; letter-spacing: .08em; }
  .cover .sub { margin-top: 10px; color: var(--muted); font-size: 14px; }
  .cover .rule { width: 36px; height: 2px; background: var(--clay); margin: 16px auto 0; opacity: .8; }

  /* 今日星星 */
  .today-stars { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 18px 0 6px; flex-wrap: wrap; }
  .today-stars .st { font-size: 20px; filter: grayscale(1) opacity(.35); transition: .25s; }
  .today-stars .st.on { filter: none; transform: scale(1.12); }
  .today-count { text-align: center; font-size: 14px; color: var(--muted); }
  .today-count b { color: var(--gold); font-size: 18px; }

  /* 分段 */
  .sec { margin-top: 22px; }
  .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .sec-head h2 { font-family: var(--serif); font-size: 19px; font-weight: 700; letter-spacing: .05em; }
  .sec-head small { font-size: 11px; color: var(--muted); letter-spacing: .18em; }

  .hb {
    width: 100%; display: flex; align-items: center; gap: 12px; text-align: left;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 13px 14px; margin-bottom: 8px; cursor: pointer; transition: .15s;
    min-height: 58px; font-family: inherit; font-size: 16px; color: var(--ink);
  }
  .hb:active { transform: scale(.98); }
  .hb .hb-ic { font-size: 26px; flex: none; width: 34px; text-align: center; }
  .hb .hb-main { flex: 1; min-width: 0; }
  .hb .hb-sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 1px; }
  .hb .hb-check {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: transparent; transition: .2s;
  }
  .hb.done { background: var(--pine-soft); border-color: var(--fresh); }
  .hb.done .hb-check { background: var(--fresh); border-color: var(--fresh); color: #fff; }
  .hb.done .hb-main { color: var(--muted); }

  /* 周进度 */
  .week-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-top: 26px; }
  .week-card h3 { font-family: var(--serif); font-size: 16px; margin-bottom: 8px; }
  .week-num { display: flex; align-items: baseline; gap: 6px; }
  .week-num b { font-size: 26px; color: var(--gold); font-family: var(--serif); }
  .week-num span { color: var(--muted); font-size: 13px; }
  .week-bar { height: 10px; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; margin: 10px 0 8px; }
  .week-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #F0B95E); border-radius: 999px; transition: width .4s; }
  .week-card p { font-size: 12.5px; color: var(--muted); }
  .week-card .hit { color: var(--fresh); font-weight: 600; }

  .footer-tip { margin-top: 22px; text-align: center; font-size: 12px; color: var(--ink-faint); line-height: 1.8; }

  /* 奖励弹层 */
  .rw {
    position: fixed; inset: 0; z-index: 99;
    background: rgba(247,245,240,.94); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: rwFade .3s ease 1.6s forwards; cursor: pointer;
  }
  .rw-emoji { font-size: 100px; line-height: 1; animation: rwBounce .7s cubic-bezier(.34,1.56,.64,1); filter: drop-shadow(0 8px 18px rgba(0,0,0,.18)); }
  .rw-title { margin-top: 14px; font-size: 24px; font-weight: 700; font-family: var(--serif); animation: rwRise .5s ease .2s both; }
  .rw-sub { margin-top: 6px; font-size: 16px; color: var(--clay); font-weight: 600; animation: rwRise .5s ease .35s both; }
  .rw-star { position: absolute; font-size: 30px; animation: rwSparkle 1.1s ease infinite alternate; }
  @keyframes rwBounce { 0% { transform: scale(.2) rotate(-14deg); opacity: 0; } 60% { transform: scale(1.15) rotate(4deg); opacity: 1; } 100% { transform: scale(1) rotate(0); } }
  @keyframes rwRise { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes rwFade { to { opacity: 0; visibility: hidden; } }
  @keyframes rwSparkle { from { transform: scale(.7) rotate(-12deg); opacity: .4; } to { transform: scale(1.25) rotate(10deg); opacity: 1; } }
</style>
</head>
<body>
<header class="cover">
  <div class="eyebrow">跳跳的每日打卡</div>
  <h1>今天也要加油鸭</h1>
  <p class="sub" id="todayStr"></p>
  <div class="rule"></div>
</header>

<div class="today-stars" id="todayStars"></div>
<div class="today-count" id="todayCount"></div>

<div id="listArea"></div>

<div class="week-card">
  <h3>本周星星 🌟</h3>
  <div class="week-num"><b id="weekGot">0</b><span>/ <span id="weekGoal">55</span> 颗达成周奖励</span></div>
  <div class="week-bar"><i id="weekBar" style="width:0%"></i></div>
  <p id="weekTip">周六晚上和爸爸妈妈一起数星星，集满就实现一个小心愿（提前商量好写下来）。</p>
</div>

<p class="footer-tip">点一下 = 打卡得 ⭐（点错了再点一下取消，让爸爸妈妈来操作）<br>数据保存在本机，换设备请在页面里做好收藏</p>

<script>
var KEY = "tiaotiao.habits.v1";
var WEEK_GOAL = 55;
var DAY_NAMES = ["", "周一", "周二", "周三", "周四", "周五", "周六", "周日"];

/* 任务定义：wd 为适用星期（1-7）；ic 图标；t 标题；s 副标题（可按星期动态） */
var HABITS = [
  { id: "dress",  sec: "morning", ic: "👕", t: "自己起床穿衣服", s: "闹钟一响就起来，不赖床" },
  { id: "teeth",  sec: "morning", ic: "🪥", t: "刷牙洗脸", s: "自己完成，不用催" },
  { id: "breakfast", sec: "morning", ic: "🍳", t: "好好吃早餐", s: "坐好吃完再玩" },
  { id: "bag",    sec: "morning", ic: "🎒", t: "自己背书包出门", s: "书包、水壶自己拿" },
  { id: "wash",   sec: "afternoon", ic: "🧼", t: "回家先洗手", s: "放学进门第一件事" },
  { id: "study",  sec: "afternoon", ic: "📚", t: "学习时间", s: "", dyn: true },
  { id: "jump",   sec: "afternoon", ic: "🏃", t: "跳绳打卡", s: "和课程表里的跳绳是同一件事" },
  { id: "chores", sec: "afternoon", ic: "🧹", t: "帮做一件家务", s: "收玩具 / 摆碗筷 / 扔垃圾" },
  { id: "wushu",  sec: "afternoon", ic: "🥋", t: "武术 10 分钟", s: "", dyn: true },
  { id: "shower", sec: "night", ic: "🛁", t: "自己洗漱", s: "刷牙、洗脸、洗脚自己来" },
  { id: "sleep",  sec: "night", ic: "🌙", t: "睡前故事 · 9点前睡觉", s: "听完故事关灯，不磨蹭" }
];
var SEC_META = {
  morning: { name: "早上 · 上学前", en: "MORNING" },
  afternoon: { name: "放学后", en: "AFTER SCHOOL" },
  night: { name: "晚上", en: "NIGHT" }
};

function todayISO() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function todayWd() { var w = new Date().getDay(); return w === 0 ? 7 : w; }
function mondayOf(dStr) {
  var d = new Date(dStr.replace(/-/g, "/"));
  var w = d.getDay() === 0 ? 7 : d.getDay();
  d.setDate(d.getDate() - (w - 1));
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function load() {
  try {
    var d = JSON.parse(localStorage.getItem(KEY));
    if (d && d.weeks) return d;
  } catch (e) {}
  return { weeks: {} };
}
function save() { localStorage.setItem(KEY, JSON.stringify(DB)); }
var DB = load();

function weekOf(dStr) {
  var wk = mondayOf(dStr);
  if (!DB.weeks[wk]) DB.weeks[wk] = {};
  if (!DB.weeks[wk][dStr]) DB.weeks[wk][dStr] = {};
  return DB.weeks[wk][dStr];
}
function habitAvail(h, wd) {
  if (wd >= 1 && wd <= 5) return true;             // 工作日全项
  if (h.id === "wash" || h.id === "study") return false;  // 周末没有放学洗手/课业复习
  return ["dress", "teeth", "breakfast", "jump", "chores", "shower", "sleep"].indexOf(h.id) >= 0;
}
function habitSub(h, wd) {
  if (h.id === "study") {
    if (wd === 1 || wd === 3) return "阅读课复习 + 识字卡翻一翻";
    if (wd === 2 || wd === 5) return "英语复习：听读 10 分钟";
    if (wd === 4) return "阅读 + 英语各来一点";
    return "识字卡复习（只看不会的）";
  }
  if (h.id === "wushu") {
    if (wd === 4) return "今天上武术课，上完就打卡 ⭐";
    return "练拳/体能，跟视频练也行";
  }
  return h.s;
}

var REWARDS = ["⭐", "🌟", "🧯", "🏅", "🎖️", "👍", "🔥", "🎉"];
function showReward(nth, total) {
  var full = nth >= total;
  var ov = document.createElement("div");
  ov.className = "rw";
  var e = full ? "🏆" : REWARDS[Math.floor(Math.random() * REWARDS.length)];
  var sparks = "";
  for (var i = 0; i < 6; i++) {
    sparks += '<div class="rw-star" style="left:' + (12 + Math.random() * 76) + '%;top:' + (14 + Math.random() * 70) + '%;animation-delay:' + (Math.random() * .6).toFixed(2) + 's">' + ["✨", "⭐", "🌟"][i % 3] + "</div>";
  }
  ov.innerHTML = sparks + '<div class="rw-emoji">' + e + '</div>' +
    '<div class="rw-title">' + (full ? "今日全勤！" : "打卡成功！") + "</div>" +
    '<div class="rw-sub">+1 ⭐　今天第 ' + nth + " / " + total + " 颗</div>";
  ov.addEventListener("click", function () { ov.remove(); });
  document.body.appendChild(ov);
  setTimeout(function () { if (ov.parentNode) ov.remove(); }, 2000);
}

function weekTotal(wk) {
  var n = 0;
  var days = Object.keys(DB.weeks[wk] || {});
  // 本周截至今天应有的总项数（周一到今天）
  var mon = new Date(wk.replace(/-/g, "/"));
  var t = new Date();
  for (var i = 0; i < 7; i++) {
    var d = new Date(mon.getTime() + i * 86400000);
    if (d > t) break;
    var wd = d.getDay() === 0 ? 7 : d.getDay();
    n += HABITS.filter(function (h) { return habitAvail(h, wd); }).length;
  }
  return n || 1;
}

function render() {
  var tISO = todayISO(), wd = todayWd();
  document.getElementById("todayStr").textContent = tISO.replace(/-/g, "/") + " · " + DAY_NAMES[wd];
  var day = weekOf(tISO);
  var list = HABITS.filter(function (h) { return habitAvail(h, wd); });

  // 顶部星星
  var doneN = list.filter(function (h) { return day[h.id]; }).length;
  document.getElementById("todayStars").innerHTML = list.map(function (h) {
    return '<span class="st' + (day[h.id] ? " on" : "") + '">⭐</span>';
  }).join("");
  document.getElementById("todayCount").innerHTML = "今天 <b>" + doneN + "</b> / " + list.length + " 颗";

  // 分段列表
  var html = "";
  ["morning", "afternoon", "night"].forEach(function (sec) {
    var items = list.filter(function (h) { return h.sec === sec; });
    if (!items.length) return;
    html += '<div class="sec"><div class="sec-head"><h2>' + SEC_META[sec].name + '</h2><small>' + SEC_META[sec].en + "</small></div>";
    items.forEach(function (h) {
      html += '<button class="hb' + (day[h.id] ? " done" : "") + '" data-h="' + h.id + '">' +
        '<span class="hb-ic">' + h.ic + '</span>' +
        '<span class="hb-main">' + h.t + '<span class="hb-sub">' + habitSub(h, wd) + "</span></span>" +
        '<span class="hb-check">✓</span></button>';
    });
    html += "</div>";
  });
  document.getElementById("listArea").innerHTML = html;
  document.querySelectorAll(".hb").forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.getAttribute("data-h");
      var day2 = weekOf(todayISO());
      var list2 = HABITS.filter(function (h) { return habitAvail(h, todayWd()); });
      if (day2[id]) {
        delete day2[id];              // 家长撤销
        save(); render();
      } else {
        day2[id] = true;
        save();
        render();
        showReward(list2.filter(function (h) { return day2[h.id]; }).length, list2.length);
      }
    });
  });

  // 周进度
  var wk = mondayOf(tISO);
  var got = 0;
  Object.keys(DB.weeks[wk] || {}).forEach(function (d) { got += Object.keys(DB.weeks[wk][d]).length; });
  document.getElementById("weekGot").textContent = got;
  document.getElementById("weekGoal").textContent = WEEK_GOAL;
  document.getElementById("weekBar").style.width = Math.min(100, got / WEEK_GOAL * 100) + "%";
  var tip = document.getElementById("weekTip");
  if (got >= WEEK_GOAL) tip.innerHTML = '<span class="hit">本周达成！🎉 周六记得兑现小心愿</span>';
  else tip.textContent = "周六晚上和爸爸妈妈一起数星星，集满 " + WEEK_GOAL + " 颗实现一个小心愿（提前商量好写下来）。";
}
render();
</script>
</body>
</html>
